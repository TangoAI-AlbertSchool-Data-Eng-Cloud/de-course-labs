# In the prototype this file lives at .github/workflows/build.yml.
# It is reproduced here under a flat name so that it is read rather than run.

name: build

on:
  push:
    branches: [main]

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the consumer
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Every environment then runs the newest build, and picks up base
          # image security fixes without anyone having to bump a version.
          tags: albertmarketplace/clickstream-consumer:latest

      - name: Build and push dbt
        uses: docker/build-push-action@v5
        with:
          context: ./transform
          push: true
          tags: albertmarketplace/dbt:latest

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform validate
