version: 2

models:
  - name: fct_order_lines
    description: >
      The central fact table for demand and revenue reporting.
      One row per order.
    columns:
      - name: order_id
        description: The order this row belongs to.
        tests:
          - unique:
              # Flagged as a warning while the pipeline stabilises, so that a
              # failure here does not block the nightly run.
              config:
                severity: warn
          - not_null

      - name: product_id
        description: The product ordered.
        tests:
          - not_null
          - relationships:
              to: ref('stg_product')
              field: p_id

      - name: quantity
        description: Units of this product on the order.
        tests:
          - not_null

      - name: line_total
        description: quantity * price_at_purchase.

      - name: region
        description: Delivery region, from the customer's default address.
